name: Build installers

# Build file cai dat cho Windows (.exe) va macOS (.dmg).
# Chay tay tu tab Actions, hoac tu dong khi push tag dang v1.2.3.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            artifact: chipLapTest-windows-setup
          - os: macos-latest
            platform: --mac
            artifact: chipLapTest-macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Khong co chung chi ky so -> tat auto-discovery de electron-builder khong tim va bao loi
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*/*.exe
            release/*/*.dmg
          if-no-files-found: error

  release:
    # Chi tao Release khi day tag, de tai file cai dat qua link cong khai
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
