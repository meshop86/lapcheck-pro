appId: com.chiplaptest.app
productName: chipLapTest
copyright: Copyright (c) 2026 Luong Xuan Hoa

# Ky ad-hoc ban macOS de may khong bao "app bi hong"
afterPack: ./afterPack.cjs

directories:
  output: release/${version}
  buildResources: resources

# Chi dong goi ket qua build cua electron-vite, khong keo theo ma nguon
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
npmRebuild: false

mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  # Cong cu ngoai (smartctl...) di kem, app doc o Resources/bin/mac
  extraResources:
    - from: resources/bin/mac
      to: bin/mac
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Chu ky ad-hoc khong di kem entitlement nen phai tat hardened runtime,
  # neu bat thi macOS chan chinh cac tien trinh con cua app
  hardenedRuntime: false
  gatekeeperAssess: false
  # Khong co chung chi Developer ID: de electron-builder bo qua, afterPack tu ky
  identity: null
  extendInfo:
    NSCameraUsageDescription: Dùng webcam để kiểm tra camera của máy.
    NSMicrophoneUsageDescription: Dùng micro để kiểm tra micro của máy.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: resources/icon.png
  extraResources:
    - from: resources/bin/win
      to: bin/win
  target:
    - target: nsis
      arch:
        - x64
  # Doc SMART, WMI va cam bien nhiet do doi hoi quyen quan tri
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
